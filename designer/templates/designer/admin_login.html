<!-- designer/templates/designer/admin_login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - PDF to Exam</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 440px;
            backdrop-filter: blur(10px);
        }
        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .login-header .icon { font-size: 3rem; margin-bottom: 10px; }
        .login-header h2 { color: #fff; font-size: 1.5rem; }
        .login-header p { color: #9999b8; font-size: 0.9rem; margin-top: 5px; }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #b8b8d4;
            font-size: 0.85rem;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #667eea;
        }
        .form-group input::placeholder { color: #666; }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-login:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg {
            background: rgba(255,71,87,0.15);
            border: 1px solid rgba(255,71,87,0.3);
            color: #ff4757;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: center;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover { text-decoration: underline; }
        .loading { display: none; }
        .loading.show { display: inline; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="icon">🛡️</div>
            <h2>Admin Login</h2>
            <p>Sign in to the administration panel</p>
        </div>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <div id="error-container" class="error-msg" style="display:none;"></div>

        <form id="login-form" method="post" action="{% url 'designer:admin_login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-login" id="btn-submit">
                <span id="btn-text">Sign In</span>
                <span id="btn-loading" class="loading">Signing in...</span>
            </button>
        </form>

        <a href="{% url 'designer:home' %}" class="back-link">← Back to Home</a>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const form = this;
            const btn = document.getElementById('btn-submit');
            const btnText = document.getElementById('btn-text');
            const btnLoading = document.getElementById('btn-loading');
            const errorContainer = document.getElementById('error-container');

            btn.disabled = true;
            btnText.style.display = 'none';
            btnLoading.classList.add('show');
            errorContainer.style.display = 'none';

            const formData = new FormData(form);

            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                }
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    errorContainer.textContent = data.error || 'Login failed.';
                    errorContainer.style.display = 'block';
                    btn.disabled = false;
                    btnText.style.display = 'inline';
                    btnLoading.classList.remove('show');
                }
            })
            .catch(() => {
                errorContainer.textContent = 'Network error. Please try again.';
                errorContainer.style.display = 'block';
                btn.disabled = false;
                btnText.style.display = 'inline';
                btnLoading.classList.remove('show');
            });
        });
    </script>
</body>
</html>
