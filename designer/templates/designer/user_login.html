<!-- designer/templates/designer/user_login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - PDF to Exam</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px 35px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .login-header { text-align: center; margin-bottom: 30px; }
        .login-icon {
            width: 70px; height: 70px; margin: 0 auto 16px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem;
        }
        .login-header h2 { color: #fff; font-size: 1.6rem; margin-bottom: 6px; }
        .login-header p { color: #b8b8d4; font-size: 0.9rem; }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; margin-bottom: 6px;
            color: #b8b8d4; font-size: 0.85rem; font-weight: 600;
        }
        .form-group input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #f093fb; }
        .form-group input::placeholder { color: #666; }

        .form-options {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 22px; font-size: 0.85rem;
        }
        .remember-me { display: flex; align-items: center; gap: 6px; color: #b8b8d4; }
        .remember-me input { width: auto; }
        .forgot-link { color: #f093fb; text-decoration: none; }
        .forgot-link:hover { text-decoration: underline; }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            font-family: inherit;
            box-shadow: 0 8px 20px rgba(240,147,251,0.3);
        }
        .btn-login:hover { opacity: 0.9; }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            color: #b8b8d4;
            font-size: 0.9rem;
        }
        .signup-link a { color: #f093fb; text-decoration: none; font-weight: 600; }
        .signup-link a:hover { text-decoration: underline; }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #666;
            font-size: 0.85rem;
            text-decoration: none;
        }
        .back-link:hover { color: #b8b8d4; }

        .error-msg {
            background: rgba(255,71,87,0.15);
            border: 1px solid rgba(255,71,87,0.3);
            color: #ff4757;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 18px;
            text-align: center;
        }

        .divider {
            display: flex; align-items: center;
            margin: 20px 0;
            color: #666; font-size: 0.75rem;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .divider span { padding: 0 12px; }

        .btn-admin {
            width: 100%;
            padding: 11px;
            background: transparent;
            border: 1px solid rgba(102,126,234,0.4);
            color: #667eea;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: block;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-admin:hover { background: rgba(102,126,234,0.1); }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-header">
        <div class="login-icon">👤</div>
        <h2>User Login</h2>
        <p>Sign in to take examinations</p>
    </div>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <div id="error-container" class="error-msg" style="display:none;"></div>

    <form id="login-form" method="post" action="{% url 'designer:user_login' %}">
        {% csrf_token %}

        <div class="form-group">
            <label for="username">Username or Email</label>
            <input type="text" id="username" name="username"
                   placeholder="Enter username or email" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter password" required>
        </div>

        <div class="form-options">
            <label class="remember-me">
                <input type="checkbox" name="remember_me"> Remember me
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login" id="btn-submit">
            Sign In
        </button>
    </form>

    <div class="signup-link">
        Don't have an account? <a href="{% url 'designer:signup' %}">Sign up</a>
    </div>

    <div class="divider"><span>OR</span></div>

    <a href="{% url 'designer:admin_login' %}" class="btn-admin">
        🛡️ Login as Administrator
    </a>

    <div style="text-align:center;">
        <a href="{% url 'designer:home' %}" class="back-link">← Back to Home</a>
    </div>
</div>

<script>
    const form = document.getElementById('login-form');
    const errorContainer = document.getElementById('error-container');
    const btnSubmit = document.getElementById('btn-submit');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        errorContainer.style.display = 'none';
        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Signing in...';

        const formData = new FormData(form);
        const csrfToken = formData.get('csrfmiddlewaretoken');

        fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': csrfToken,
                'X-Requested-With': 'XMLHttpRequest',
            },
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                window.location.href = data.redirect;
            } else {
                errorContainer.textContent = data.error || 'Login failed.';
                errorContainer.style.display = 'block';
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Sign In';
            }
        })
        .catch(() => {
            errorContainer.textContent = 'Network error. Please try again.';
            errorContainer.style.display = 'block';
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Sign In';
        });
    });
</script>

</body>
</html>
