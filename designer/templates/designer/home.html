<!-- designer/templates/designer/home.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Examgen — Intelligent Examination Platform. Generate exams, take tests, and review results.">
    <title>Examgen — Intelligent Examination Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: #0a0a0f;
            color: #fff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* === Glassmorphism Navigation === */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            padding-top: env(safe-area-inset-top);
            height: calc(60px + env(safe-area-inset-top));
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 100;
            animation: navSlideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes navSlideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .navbar-brand:focus-visible {
            outline: 2px solid rgba(102, 126, 234, 0.8);
            outline-offset: 4px;
            border-radius: 8px;
        }

        .navbar-brand .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .navbar-brand span {
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .nav-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2ed573;
            box-shadow: 0 0 0 0 rgba(46, 213, 115, 0.5);
            animation: dotPulse 2s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(46, 213, 115, 0.35); }
            50% { opacity: 0.55; box-shadow: 0 0 0 6px rgba(46, 213, 115, 0); }
        }

        /* === Animated Background === */
        .bg-mesh {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(102, 126, 234, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(118, 75, 162, 0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 100, 150, 0.06) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            will-change: transform;
        }

        .orb-1 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.3), transparent 70%);
            top: -120px; left: -120px;
            animation: orb1 20s ease-in-out infinite;
        }

        .orb-2 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(245, 87, 108, 0.25), transparent 70%);
            bottom: -100px; right: -100px;
            animation: orb2 25s ease-in-out infinite;
        }

        .orb-3 {
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(118, 75, 162, 0.2), transparent 70%);
            top: 40%; left: 60%;
            animation: orb3 30s ease-in-out infinite;
        }

        @keyframes orb1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, 30px); }
        }
        @keyframes orb2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, -40px); }
        }
        @keyframes orb3 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-20px, 25px); }
        }

        /* === Main Content === */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 80px 20px 30px;
            padding-top: calc(80px + env(safe-area-inset-top));
            position: relative;
            z-index: 1;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-wrapper {
            margin-bottom: 20px;
            animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            line-height: 1;
            box-shadow: 0 16px 48px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
            pointer-events: none;
        }

        h1 {
            font-size: clamp(2rem, 7vw, 3.5rem);
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, #a8b5ff 40%, #c4a8ff 70%, #64e8ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.03em;
            line-height: 1.1;
            animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
        }

        .tagline {
            font-size: clamp(0.8rem, 2.2vw, 1rem);
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 36px;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            width: 100%;
            max-width: 420px;
            animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
        }

        .btn-card {
            padding: 28px 16px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s, border-color 0.25s;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            -webkit-user-select: none;
            user-select: none;
            min-height: 140px;
            justify-content: center;
        }

        .btn-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.03) 50%, transparent 60%);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
            pointer-events: none;
        }

        .btn-card:hover::before {
            transform: translateX(100%);
        }

        .btn-card:focus-visible {
            outline: 2px solid rgba(102, 126, 234, 0.9);
            outline-offset: 3px;
        }

        .btn-card:active {
            transform: scale(0.96);
        }

        @media (hover: hover) and (pointer: fine) {
            .btn-card:hover {
                transform: translateY(-4px);
            }
            .btn-admin:hover {
                border-color: rgba(102, 126, 234, 0.4);
                box-shadow: 0 12px 40px rgba(102, 126, 234, 0.25);
            }
            .btn-user:hover {
                border-color: rgba(245, 87, 108, 0.4);
                box-shadow: 0 12px 40px rgba(245, 87, 108, 0.25);
            }
        }

        .btn-icon {
            font-size: 2.2rem;
            line-height: 1;
        }

        .btn-title {
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            color: #fff;
        }

        .btn-subtitle {
            font-size: 0.72rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 0.02em;
            line-height: 1.3;
        }

        .footer {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            padding: 20px 0 8px;
            width: 100%;
            animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
        }

        /* === Page Transition Overlay === */
        .transition-overlay {
            position: fixed;
            inset: 0;
            background: #0a0a0f;
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .transition-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        /* ===== DESKTOP ===== */
        @media (min-width: 769px) {
            .navbar { padding: 0 40px; height: calc(64px + env(safe-area-inset-top)); }
            .navbar-brand { font-size: 1.2rem; }
            .navbar-brand .brand-icon { width: 36px; height: 36px; font-size: 1.1rem; }

            .container { padding: 0 40px; }
            .logo-icon {
                width: 100px; height: 100px;
                font-size: 3rem; border-radius: 24px;
                animation: logoPulse 3s ease-in-out infinite;
            }
            @keyframes logoPulse {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.05); }
            }
            h1 { margin-bottom: 12px; }
            .tagline { margin-bottom: 56px; }
            .buttons { gap: 24px; }
            .btn-card { padding: 40px 36px; min-height: 170px; border-radius: 24px; }
            @media (hover: hover) and (pointer: fine) {
                .btn-card:hover { transform: translateY(-8px) scale(1.02); }
            }
            .btn-icon { font-size: 2.8rem; }
            .btn-title { font-size: 1.2rem; }
            .btn-subtitle { font-size: 0.82rem; }
            .footer { padding: 30px 0 0; font-size: 0.85rem; }
        }

        /* ===== TABLET ===== */
        @media (min-width: 481px) and (max-width: 768px) {
            .btn-card { padding: 32px 20px; min-height: 150px; }
            .btn-icon { font-size: 2.5rem; }
            .btn-title { font-size: 1.1rem; }
        }

        /* ===== SMALL PHONES ===== */
        @media (max-width: 380px) {
            .navbar { padding: 0 16px; }
            .main-wrapper { padding: 70px 14px 20px; padding-top: calc(70px + env(safe-area-inset-top)); }
            .buttons { gap: 10px; }
            .btn-card { padding: 22px 12px; min-height: 120px; border-radius: 16px; }
            .btn-icon { font-size: 1.8rem; }
            .btn-title { font-size: 0.9rem; }
            .btn-subtitle { font-size: 0.68rem; }
            .logo-icon { width: 64px; height: 64px; font-size: 2rem; border-radius: 16px; }
        }

        /* ===== LANDSCAPE PHONES ===== */
        @media (max-height: 500px) and (orientation: landscape) {
            .navbar { height: calc(48px + env(safe-area-inset-top)); }
            .main-wrapper {
                padding-top: calc(56px + env(safe-area-inset-top));
                justify-content: flex-start;
            }
            .logo-wrapper { margin-bottom: 10px; }
            .logo-icon { width: 48px; height: 48px; font-size: 1.5rem; }
            h1 { font-size: 1.6rem; margin-bottom: 4px; }
            .tagline { font-size: 0.68rem; margin-bottom: 12px; }
            .buttons { gap: 8px; }
            .btn-card { padding: 14px 10px; min-height: 80px; }
            .btn-icon { font-size: 1.4rem; }
            .btn-title { font-size: 0.82rem; }
            .btn-subtitle { display: none; }
            .footer { padding: 6px 0 4px; font-size: 0.68rem; }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .navbar,
            .logo-wrapper,
            h1,
            .tagline,
            .buttons,
            .footer,
            .logo-icon,
            .orb,
            .nav-dot {
                animation: none !important;
            }
            .btn-card,
            .btn-card::before,
            .transition-overlay {
                transition: none !important;
            }
            .orb { opacity: 0.5; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
    </style>
</head>
<body>
    <!-- Glassmorphism Navigation -->
    <nav class="navbar" aria-label="Primary">
        <a href="{% url 'designer:home' %}" class="navbar-brand">
            <div class="brand-icon" aria-hidden="true">📝</div>
            Exam<span>gen</span>
        </a>
        <div class="nav-status" title="System status">
            <div class="nav-dot" aria-hidden="true"></div>
            <span>Platform Ready</span>
        </div>
    </nav>

    <!-- Animated Background -->
    <div class="bg-mesh" aria-hidden="true"></div>
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>
    <div class="orb orb-3" aria-hidden="true"></div>

    <!-- Main Content -->
    <main class="main-wrapper">
        <div class="container">
            <div class="logo-wrapper">
                <div class="logo-icon" aria-hidden="true">📝</div>
            </div>

            <h1>Examgen</h1>
            <p class="tagline">Intelligent Examination Platform</p>

            <div class="buttons" role="navigation" aria-label="Sign in options">
                <a href="{% url 'designer:admin_login' %}"
                   class="btn-card btn-admin"
                   data-transition="admin"
                   aria-label="Admin login — Administration Panel">
                    <span class="btn-icon" aria-hidden="true">🛡️</span>
                    <span class="btn-title">ADMIN</span>
                    <span class="btn-subtitle">Administration Panel</span>
                </a>
                <a href="{% url 'designer:user_login' %}"
                   class="btn-card btn-user"
                   data-transition="user"
                   aria-label="User login — Take Examinations">
                    <span class="btn-icon" aria-hidden="true">👤</span>
                    <span class="btn-title">USER</span>
                    <span class="btn-subtitle">Take Examinations</span>
                </a>
            </div>

            <p class="footer">Examgen &copy; 2026 &mdash; Intelligent Examination Platform</p>
        </div>
    </main>

    <!-- Page Transition Overlay -->
    <div class="transition-overlay" id="transition-overlay" aria-hidden="true"></div>

    <script>
        (function () {
            var overlay = document.getElementById('transition-overlay');

            function resetOverlay() {
                if (overlay) {
                    overlay.classList.remove('active');
                    overlay.setAttribute('aria-hidden', 'true');
                }
            }

            // Fix: returning via browser back (bfcache) left the screen black
            window.addEventListener('pageshow', function (e) {
                resetOverlay();
            });
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') resetOverlay();
            });

            document.querySelectorAll('[data-transition]').forEach(function (link) {
                link.addEventListener('click', function (e) {
                    // Allow new-tab / new-window / modified clicks
                    if (
                        e.defaultPrevented ||
                        e.button !== 0 ||
                        e.metaKey ||
                        e.ctrlKey ||
                        e.shiftKey ||
                        e.altKey
                    ) {
                        return;
                    }

                    e.preventDefault();
                    if (!overlay) {
                        window.location.href = link.href;
                        return;
                    }

                    overlay.classList.add('active');
                    overlay.setAttribute('aria-hidden', 'false');

                    var href = link.href;
                    setTimeout(function () {
                        window.location.href = href;
                    }, 300);
                });
            });
        })();
    </script>
</body>
</html>
